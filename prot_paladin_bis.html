<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f1117; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 28px 32px; min-height: 100vh; }
h1 { font-size: 22px; font-weight: 400; color: #f1f5f9; letter-spacing: 0.5px; }
.sub { font-size: 11px; color: #475569; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 10px; align-items: center; }
.slot-btn { font-size: 11px; padding: 3px 9px; border-radius: 4px; cursor: pointer; border: 1px solid #334155; background: #1e293b; color: #94a3b8; transition: all 0.12s; }
.slot-btn:hover { border-color: #475569; }
.slot-btn.off { background: transparent; color: #334155; border-color: #1e293b; }
.feat-btns { margin-left: auto; display: flex; gap: 6px; }
.feat-btn { font-size: 11px; padding: 3px 11px; border-radius: 4px; cursor: pointer; border: 1px solid #1e293b; background: transparent; color: #334155; transition: all 0.12s; }
.feat-btn.on { border-color: #378ADD; color: #378ADD; background: rgba(55,138,221,0.1); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #94a3b8; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
#chart-wrap { position: relative; }
#sc { display: block; width: 100%; max-width: 900px; overflow: visible; }
circle { transition: r 0.1s; cursor: pointer; }
.tip {
  position: absolute; pointer-events: none;
  background: #0f172a; border: 1px solid #334155;
  border-radius: 8px; padding: 10px 14px; width: 220px;
  font-size: 12px; z-index: 10; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.tip.pinned { pointer-events: auto; display: block !important; }
.tip-phase { font-size: 10px; margin-bottom: 3px; letter-spacing: 0.5px; }
.tip-name { font-size: 13px; font-weight: 500; color: #f1f5f9; margin-bottom: 8px; line-height: 1.3; }
.tip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; font-size: 11px; }
.tip-label { color: #64748b; }
.tip-val-t { color: #60a5fa; text-align: right; font-weight: 500; }
.tip-val-m { color: #34d399; text-align: right; font-weight: 500; }
.tip-link { display: block; margin-top: 8px; font-size: 10px; color: #f59e0b; text-decoration: none; letter-spacing: 0.5px; }
.tip-link:hover { text-decoration: underline; }
.tip-hint { font-size: 9px; color: #334155; margin-top: 6px; }
.footer { font-size: 11px; color: #334155; margin-top: 8px; }
</style>
</head>

const PHASES = ["Pre-Raid","Phase 1","Phase 2","Phase 3","Phase 4","Phase 5"];
const PCOL = {"Pre-Raid":"#888780","Phase 1":"#378ADD","Phase 2":"#1D9E75","Phase 3":"#BA7517","Phase 4":"#D85A30","Phase 5":"#7F77DD"};
const SLOTS = [...new Set(DATA.map(d=>d[2]))].sort();

let activeSlots = new Set(SLOTS);
let showPareto = true;
let showLabels = false;
let pinned = null;

const svg = document.getElementById('sc');
const tip = document.getElementById('tip');
const NS = 'http://www.w3.org/2000/svg';

const PAD = {t:32,r:32,b:54,l:60};
const VW = 860, VH = 500;
const PW = VW-PAD.l-PAD.r, PH = VH-PAD.t-PAD.b;
svg.setAttribute('viewBox',`0 0 ${VW} ${VH}`);

function el(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  for(const[k,v] of Object.entries(attrs||{})) e.setAttribute(k,v);
  parent&&parent.appendChild(e);
  return e;
}
function txt(content,attrs,parent){
  const e=el('text',attrs,parent);
  e.textContent=content; return e;
}

function pareto(pts){
  const s=[...pts].sort((a,b)=>b[0]-a[0]);
  const f=[];let mxM=-Infinity;
  for(const p of s){if(p[1]>mxM){f.push(p);mxM=p[1];}}
  return f;
}

let scX,scY;

function render(){
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  tip.style.display='none'; tip.className='tip';

  const pts=DATA.filter(d=>activeSlots.has(d[2]));
  if(!pts.length){txt('No items selected',{x:VW/2,y:VH/2,'text-anchor':'middle',fill:'#475569',fontSize:14},svg);return;}

  const ts=pts.map(d=>d[3]),ms=pts.map(d=>d[4]);
  const minT=Math.min(...ts),maxT=Math.max(...ts),minM=Math.min(...ms),maxM=Math.max(...ms);
  const pt=(maxT-minT)*0.08,pm=(maxM-minM)*0.08;
  const t0=minT-pt,t1=maxT+pt,m0=minM-pm,m1=maxM+pm;
  scX=v=>PAD.l+((v-t0)/(t1-t0))*PW;
  scY=v=>PAD.t+PH-((v-m0)/(m1-m0))*PH;

  const g=el('g',{},svg);
  for(let i=0;i<=6;i++){
    const v=t0+(t1-t0)*i/6,x=scX(v);
    el('line',{x1:x,y1:PAD.t,x2:x,y2:PAD.t+PH,stroke:'#1e293b','stroke-width':.5},g);
    txt(Math.round(v),{x,y:PAD.t+PH+16,'text-anchor':'middle',fontSize:10,fill:'#475569'},g);
  }
  for(let i=0;i<=5;i++){
    const v=m0+(m1-m0)*i/5,y=scY(v);
    el('line',{x1:PAD.l,y1:y,x2:PAD.l+PW,y2:y,stroke:'#1e293b','stroke-width':.5},g);
    txt(Math.round(v),{x:PAD.l-8,y:y+4,'text-anchor':'end',fontSize:10,fill:'#475569'},g);
  }
  txt('Threat score →',{x:PAD.l+PW/2,y:PAD.t+PH+40,'text-anchor':'middle',fontSize:11,fill:'#475569','letter-spacing':1},svg);
  const yl=el('text',{transform:`translate(15,${PAD.t+PH/2}) rotate(-90)`,'text-anchor':'middle',fontSize:11,fill:'#475569','letter-spacing':1},svg);
  yl.textContent='Mitigation score →';

  if(showPareto&&pts.length>1){
    const fp=pareto(pts.map(d=>[d[3],d[4]])).sort((a,b)=>a[0]-b[0]);
    if(fp.length>1){
      const d=fp.map((p,i)=>`${i?'L':'M'}${scX(p[0]).toFixed(1)},${scY(p[1]).toFixed(1)}`).join('');
      el('path',{d,fill:'none',stroke:'#BA7517','stroke-width':1.5,'stroke-dasharray':'6,3',opacity:.7},svg);
    }
  }

  const clip=el('clipPath',{id:'clip'},svg);
  el('rect',{x:PAD.l,y:PAD.t,width:PW,height:PH},clip);
  const cg=el('g',{'clip-path':'url(#clip)'},svg);

  pts.forEach(d=>{
    const cx=scX(d[3]),cy=scY(d[4]);
    const pg=el('g',{},cg);
    const c=el('circle',{cx,cy,r:5.5,fill:PCOL[d[1]],opacity:.83},pg);
    c.addEventListener('mouseenter',()=>{if(!pinned)showTip(d,cx,cy,false);c.setAttribute('r',8);c.setAttribute('opacity',1);});
    c.addEventListener('mouseleave',()=>{if(!pinned){tip.style.display='none';}c.setAttribute('r',5.5);c.setAttribute('opacity',.83);});
    c.addEventListener('click',e=>{
      e.stopPropagation();
      if(pinned===d){pinned=null;tip.style.display='none';}
      else{pinned=d;showTip(d,cx,cy,true);}
    });
    if(showLabels){
      txt(d[0].split(' ').slice(0,2).join(' '),{x:cx+7,y:cy+4,fontSize:9,fill:'#64748b','pointer-events':'none'},pg);
    }
  });

  svg.addEventListener('click',()=>{pinned=null;tip.style.display='none';});
  document.getElementById('footer').textContent=`${pts.length} items shown`;
}

function showTip(d,cx,cy,isPinned){
  tip.innerHTML=`
    <div class="tip-phase" style="color:${PCOL[d[1]]}">${d[1]} · ${d[2]}</div>
    <div class="tip-name">${d[0]}</div>
    <div class="tip-grid">
      <span class="tip-label">Threat</span><span class="tip-val-t">${d[3]}</span>
      <span class="tip-label">Mitigation</span><span class="tip-val-m">${d[4]}</span>
    </div>
    ${isPinned?`<a class="tip-link" href="${d[5]}" target="_blank" rel="noreferrer">View on Wowhead →</a>`:'<div class="tip-hint">click to pin</div>'}
  `;
  const svgRect=svg.getBoundingClientRect();
  const tipW=220;
  const rawX=cx/VW*svgRect.width;
  const rawY=cy/VH*svgRect.height;
  const left=(rawX+14+tipW>svgRect.width)?rawX-tipW-14:rawX+14;
  const top=Math.max(0,rawY-60);
  tip.style.left=left+'px';
  tip.style.top=top+'px';
  tip.style.display='block';
  tip.className=isPinned?'tip pinned':'tip';
}

function buildControls(){
  const c=document.getElementById('slot-btns');
  c.style.cssText='display:flex;flex-wrap:wrap;gap:4px;';
  SLOTS.forEach(s=>{
    const b=document.createElement('button');
    b.textContent=s; b.className='slot-btn'; b.dataset.slot=s;
    b.addEventListener('click',()=>{
      if(activeSlots.has(s)){activeSlots.delete(s);b.className='slot-btn off';}
      else{activeSlots.add(s);b.className='slot-btn';}
      pinned=null; render();
    });
    c.appendChild(b);
  });
  const leg=document.getElementById('legend');
  PHASES.forEach(p=>{
    const d=document.createElement('div');
    d.className='legend-item';
    d.innerHTML=`<span class="legend-dot" style="background:${PCOL[p]}"></span>${p}`;
    leg.appendChild(d);
  });
}

document.getElementById('btn-pareto').addEventListener('click',function(){
  showPareto=!showPareto;this.className=showPareto?'feat-btn on':'feat-btn';render();
});
document.getElementById('btn-labels').addEventListener('click',function(){
  showLabels=!showLabels;this.className=showLabels?'feat-btn on':'feat-btn';render();
});

buildControls();
render();
</script>
